name: Supabase migrations

# Applies forward-only schema migrations to the production Supabase project.
#
# Vercel deployments are NOT handled here. Vercel's own Git integration already
# deploys every push (main -> production, any other branch -> preview). Adding a
# Vercel step to this workflow would deploy twice.

# Run only after the complete application CI for a push to main has passed.
# workflow_dispatch is intentionally absent: it must not bypass the CI gate.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never cancel a migration mid-flight: a half-applied migration is worse than a
# queued one.
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not a secret - this ref appears in every project URL.
  SUPABASE_PROJECT_REF: vhrnrbnjhmxrygvyfirf

jobs:
  apply:
    name: Apply migrations to production (eu-west-3)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    # The approval gate lives in GitHub settings, not in this file. With no
    # reviewer configured on the "production" environment this runs fully
    # automatically. Adding a required reviewer turns it into an approval step
    # with no code change. See docs/deployment.md.
    environment: production

    steps:
      # workflow_run normally checks out the latest default branch, not the
      # commit that passed CI. Always use the verified exact SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # If main has advanced since this CI run, the later push's CI will
      # trigger its own migration job. Never deploy an obsolete revision.
      - name: Confirm verified commit is still main
        id: head
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse FETCH_HEAD)" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping obsolete CI commit; main has advanced."
          fi

      - name: Check for migrations to apply
        if: steps.head.outputs.current == 'true'
        id: check
        run: |
          if [ -z "$(find supabase/migrations -name '*.sql' -print -quit 2>/dev/null)" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .sql files in supabase/migrations - nothing to apply."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Migrations found:"
            find supabase/migrations -name '*.sql' | sort
          fi

      - name: Verify required secrets are present
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set on this repository."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD is not set on this repository."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "See docs/deployment.md for where each value comes from."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Apply migrations
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Refuse a stale run even if main advanced during setup/linking.
          git fetch origin main --depth=1
          if [ "$(git rev-parse FETCH_HEAD)" != "$VERIFIED_SHA" ]; then
            echo "::error::main advanced after CI; refusing migration deployment."
            exit 1
          fi
          supabase db push

      - name: Confirm applied state
        if: steps.head.outputs.current == 'true' && steps.check.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

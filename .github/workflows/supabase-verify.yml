name: Verify migrations

# Applies every migration from scratch against a throwaway local Postgres, so a
# migration that cannot replay never reaches the production database.
#
# This is the guard that makes auto-applying migrations on main defensible:
# nothing lands in Paris that has not already replayed cleanly here. That was
# only true of pull requests until 30 Oct -- this workflow did not run on a push
# to main at all, so the migrations workflow had nothing to wait for and applied
# on CI alone. It now runs on main too, and the apply job requires it.

# The paths filter is on pull_request only, deliberately. On main this must run
# for EVERY push: the migrations workflow waits for this check before it touches
# the production database, and a run that never happens because the push touched
# no supabase/ file would hold that gate open for ever. A few wasted minutes on
# an unrelated push is the cheaper side of that trade.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-verify.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: Replay migrations on a clean database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations to verify
        id: check
        run: |
          if [ -z "$(find supabase/migrations -name '*.sql' -print -quit 2>/dev/null)" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .sql files in supabase/migrations - nothing to verify."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.present == 'true'
        with:
          version: 2.122.0

      - name: Start local Supabase and replay all migrations
        if: steps.check.outputs.present == 'true'
        run: supabase db start

      # A migration that applies once but not twice will eventually break a
      # rebuild, a branch database, or a restore. Catch it now.
      - name: Replay a second time from scratch
        if: steps.check.outputs.present == 'true'
        run: supabase db reset

      # SQL negative tests (pgTAP): one JWT per role — anon, client A, client B,
      # firm reviewer. A policy that lets the wrong caller in fails the PR.
      - name: Run SQL negative tests
        if: steps.check.outputs.present == 'true'
        run: |
          if [ -n "$(find supabase/tests -name '*.sql' -print -quit 2>/dev/null)" ]; then
            supabase test db
          else
            echo "No SQL tests in supabase/tests."
          fi

      - name: Two-session taxpayer first-grant race
        if: steps.check.outputs.present == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          bash scripts/test-two-session-first-grant.sh

      - name: Two-session approval versus direct-client-opening NIU race
        if: steps.check.outputs.present == 'true'
        run: bash scripts/test-cross-entrypoint-lock-proof.sh

      - name: Check for schema drift against committed migrations
        if: steps.check.outputs.present == 'true'
        run: |
          # If this prints a diff, the migrations do not fully describe the
          # schema they produce.
          supabase db diff --local --schema public

      - name: Stop local Supabase
        if: always() && steps.check.outputs.present == 'true'
        run: supabase stop --no-backup || true

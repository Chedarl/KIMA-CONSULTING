name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test PR changed-line guard
        run: node --test scripts/pr-size-gate.test.mjs
      - name: Enforce Phase 2 PR size limit
        if: github.event_name == 'pull_request'
        run: node scripts/pr-size-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:journey
      # The marketing consistency guard. Without this line it is decorative:
      # the pricing section could drift back to pairing by position, or the
      # no-authorization disclaimer could be deleted, and CI would stay green.
      - run: npm run test:marketing
      - run: npm run test:staff:contract
      - run: npm run test:staff:screen
      - run: npm run test:staff:route
      - run: npm run test:staff
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 64" width="288" height="64" role="img" aria-label="KIMA CONSULTING">
  <title>KIMA CONSULTING</title>
  <!--
    Primary horizontal brand signature. KIMA is dominant; CONSULTING is tracked
    out beneath it on the same optical left edge.

    The wordmark is LIVE TEXT so it stays editable. Convert it to outlines
    before sending to print, or to anyone without IBM Plex Sans installed —
    otherwise it falls back to a system sans.
  -->
  <g transform="translate(8 8) scale(0.75)">
    <rect x="10" y="8" width="10" height="48" rx="3" fill="#163B66" />
    <path d="M24 30 L42 8 L54 8 L36 30 Z" fill="#163B66" />
    <path d="M24 34 L36 34 L54 56 L42 56 Z" fill="#1E9E74" />
  </g>
  <text
    x="64"
    y="35"
    font-family="'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="27"
    font-weight="700"
    letter-spacing="0.4"
    fill="#163B66"
  >KIMA</text>
  <text
    x="65.5"
    y="50"
    font-family="'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="10.5"
    font-weight="500"
    letter-spacing="4.1"
    fill="#4A5A70"
  >CONSULTING</text>
</svg>
